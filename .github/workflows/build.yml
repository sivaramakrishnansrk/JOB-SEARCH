name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Wrapper, Properties and Build Directory
        run: |
          # Detect nested directories if present
          if [ -d "MechJobRadar" ]; then
            cd MechJobRadar
          elif [ -d "JobTrackerApp" ]; then
            cd JobTrackerApp
          fi
          
          # Force AndroidX flags in gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          
          # Generate gradlew wrapper if missing
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          if [ -d "MechJobRadar" ]; then
            cd MechJobRadar
          elif [ -d "JobTrackerApp" ]; then
            cd JobTrackerApp
          fi
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 14
          
